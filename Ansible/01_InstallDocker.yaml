---
- name: Install Docker on Ubuntu servers
  hosts: servers
  become: true
  pre_tasks:
    - name: Update apt cache
      tags:
        - pretask1
        - cache_update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required dependencies
      tags:
        - pretask2
        - dependency
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

  tasks:
    - name: Add Docker repository with GPG key
      tags:
        - task1
        - repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"

    - name: Install Docker
      tags:
        - task2
        - installer
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true

    - name: Start and enable Docker service
      tags:
        - task3
        - service
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Add Ansible user to docker group
      tags:
        - task4
        - group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Flush handlers to restart Docker if needed
      tags:
        - task5
        - cleanup
      ansible.builtin.meta: flush_handlers

    - name: Reset Ansible SSH connection for docker group membership
      tags:
        - task6
        - connection_reset
      ansible.builtin.meta: reset_connection